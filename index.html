  <script>
/* views_stock.js — Inventory screen. */
(function () {
  'use strict';
  const U = MZ.U, I = MZ.Inventory, UI = MZ.UI, { $, $$, opt } = MZ.UI;
  const V = (MZ.Views = MZ.Views || {});
  const e = U.esc, m = U.money;
  const filt = { q: '', cat: '', showArchived: false, lowOnly: false };

  function productForm(p) {
    const isNew = !p; p = p || {};
    return '<label for="fName">Product name</label><input id="fName" name="name" value="' + e(p.name || '') + '" required maxlength="100" autocomplete="off">' +
      '<div class="row"><div><label for="fCat">Category</label><input id="fCat" name="category" list="catList" value="' + e(p.category || '') + '" placeholder="e.g. Solar panel, LED, Battery" autocomplete="off"></div>' +
      '<div><label for="fUnit">Unit</label><input id="fUnit" name="unit" value="' + e(p.unit || 'pcs') + '" placeholder="pcs, meter, set"></div></div>' +
      '<div class="row"><div><label for="fCost">Purchase cost (৳ each)</label><input id="fCost" name="costPrice" inputmode="decimal" value="' + (p.costPrice != null ? p.costPrice : '') + '" required></div>' +
      '<div><label for="fPrice">Selling price (৳ each)</label><input id="fPrice" name="sellPrice" inputmode="decimal" value="' + (p.sellPrice != null ? p.sellPrice : '') + '" required></div></div>' +
      '<div class="row">' + (isNew ? '<div><label for="fQty">Opening quantity</label><input id="fQty" name="qty" inputmode="decimal" value="0"></div>' : '') +
      '<div><label for="fLow">Warn me when stock is at or below</label><input id="fLow" name="lowStock" inputmode="decimal" value="' + (p.lowStock != null ? p.lowStock : 5) + '"></div></div>' +
      (isNew ? '' : '<p class="muted small">To change the quantity, use <b>Add stock</b> or <b>Adjust</b> so there is a record of it.</p>');
  }

  V.inventory = async function (el) {
    const products = await I.listProducts();
    const cats = Array.from(new Set(products.map((p) => p.category))).sort();
    const list = products.filter(function (p) {
      if (!filt.showArchived && p.archived) return false;
      if (filt.cat && p.category !== filt.cat) return false;
      if (filt.lowOnly && !(p.lowStock > 0 && p.qty <= p.lowStock)) return false;
      if (filt.q && (p.name + ' ' + p.category).toLowerCase().indexOf(filt.q.toLowerCase()) < 0) return false;
      return true;
    }).sort((a, b) => a.name.localeCompare(b.name));
    const totalCost = U.round2(list.reduce((t, p) => t + p.qty * p.costPrice, 0));

    el.innerHTML =
      '<div class="page-head"><h2>Stock</h2><button id="addP">+ New product</button></div>' +
      '<datalist id="catList">' + cats.map((c) => '<option value="' + e(c) + '">').join('') + '</datalist>' +
      '<div class="toolbar"><input type="search" id="q" placeholder="Search products…" value="' + e(filt.q) + '" aria-label="Search products">' +
      '<select id="cat" aria-label="Category"><option value="">All categories</option>' + cats.map((c) => opt(c, c, c === filt.cat)).join('') + '</select>' +
      '<select id="mode" aria-label="Filter"><option value="active"' + (!filt.showArchived && !filt.lowOnly ? ' selected' : '') + '>Active products</option><option value="low"' + (filt.lowOnly ? ' selected' : '') + '>Low stock only</option><option value="all"' + (filt.showArchived ? ' selected' : '') + '>Include archived</option></select></div>' +
      '<p class="muted small">' + list.length + ' product(s) · stock value at cost: <b>' + m(totalCost) + '</b></p>' +
      (list.length ? '<table class="rt"><thead><tr><th>Product</th><th>Category</th><th class="num">Stock</th><th class="num">Cost</th><th class="num">Price</th><th class="num">Value</th><th></th></tr></thead><tbody>' +
        list.map(function (p) {
          const low = p.lowStock > 0 && p.qty <= p.lowStock;
          return '<tr><td class="title" data-l="Product">' + e(p.name) + (p.archived ? ' <span class="badge gray">Archived</span>' : '') + '</td>' +
            '<td data-l="Category">' + e(p.category) + '</td>' +
            '<td class="num" data-l="Stock">' + U.qty(p.qty) + ' ' + e(p.unit) + (low && !p.archived ? ' <span class="badge low">Low</span>' : '') + '</td>' +
            '<td class="num" data-l="Cost">' + m(p.costPrice) + '</td><td class="num" data-l="Price">' + m(p.sellPrice) + '</td>' +
            '<td class="num" data-l="Value">' + m(p.qty * p.costPrice) + '</td>' +
            '<td class="act"><div class="actions">' +
            (p.archived ? '<button class="small secondary" data-a="restore" data-id="' + p.id + '">Restore</button>' :
              '<button class="small" data-a="buy" data-id="' + p.id + '">Add stock</button><button class="small secondary" data-a="adj" data-id="' + p.id + '">Adjust</button><button class="small secondary" data-a="edit" data-id="' + p.id + '">Edit</button>') +
            '<button class="small secondary" data-a="hist" data-id="' + p.id + '">History</button>' +
            (p.archived ? '' : '<button class="small danger" data-a="arch" data-id="' + p.id + '">Archive</button>') + '</div></td></tr>';
        }).join('') + '</tbody></table>' : '<p class="empty">' + (products.length ? 'No products match your search.' : 'No products yet. Tap “+ New product” to add your first one.') + '</p>');

    $('#q', el).addEventListener('input', function (ev) { filt.q = ev.target.value; const pos = ev.target.selectionStart; V.inventory(el).then(() => { const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }); });
    $('#cat', el).addEventListener('change', (ev) => { filt.cat = ev.target.value; V.inventory(el); });
    $('#mode', el).addEventListener('change', (ev) => { filt.showArchived = ev.target.value === 'all'; filt.lowOnly = ev.target.value === 'low'; V.inventory(el); });
    $('#addP', el).addEventListener('click', () => UI.modal({
      title: 'New product', submitLabel: 'Save product', body: productForm(null),
      onSubmit: async (f) => { await I.saveProduct(UI.formData(f)); UI.toast('Product saved.'); V.inventory(el); },
    }));
    const byId = (id) => products.find((p) => p.id === Number(id));
    $$('[data-a]', el).forEach((b) => b.addEventListener('click', async function () {
      const p = byId(b.dataset.id), a = b.dataset.a;
      if (a === 'edit') UI.modal({ title: 'Edit product', body: productForm(p), onSubmit: async (f) => { await I.saveProduct(UI.formData(f), p.id); UI.toast('Product updated.'); V.inventory(el); } });
      if (a === 'buy') UI.modal({
        title: 'Add stock: ' + p.name, submitLabel: 'Add to stock',
        body: '<p class="muted small">Current stock: ' + U.qty(p.qty) + ' ' + e(p.unit) + ' · current cost ' + m(p.costPrice) + '. The average cost is updated automatically.</p>' +
          '<div class="row"><div><label>Quantity bought</label><input name="qty" inputmode="decimal" required></div><div><label>Cost per unit (৳)</label><input name="unitCost" inputmode="decimal" value="' + p.costPrice + '" required></div></div>' +
          '<div class="row"><div><label>Date</label><input type="date" name="date" value="' + U.today() + '" required></div><div><label>Supplier (optional)</label><input name="supplier"></div></div><label>Note (optional)</label><input name="note">',
        onSubmit: async (f) => { await I.addPurchase(Object.assign(UI.formData(f), { productId: p.id })); UI.toast('Stock added.'); V.inventory(el); },
      });
      if (a === 'adj') UI.modal({
        title: 'Adjust stock: ' + p.name, submitLabel: 'Save adjustment',
        body: '<p class="muted small">Current stock: <b>' + U.qty(p.qty) + ' ' + e(p.unit) + '</b>. Use a minus sign to reduce (e.g. -2 for damaged items).</p>' +
          '<label>Change in quantity</label><input name="change" inputmode="decimal" placeholder="-2 or 3" required><label>Reason</label><input name="reason" placeholder="Damaged, counted again, returned…" required>',
        onSubmit: async (f) => { await I.adjustStock(Object.assign(UI.formData(f), { productId: p.id })); UI.toast('Stock adjusted.'); V.inventory(el); },
      });
      if (a === 'arch') { if (await UI.confirmBox('Archive product?', '“' + e(p.name) + '” will be hidden from lists and cannot be sold. Its history is kept and you can restore it any time.', 'Archive')) { await I.setArchived(p.id, true); UI.toast('Archived.'); V.inventory(el); } }
      if (a === 'restore') { await I.setArchived(p.id, false); UI.toast('Restored.'); V.inventory(el); }
      if (a === 'hist') {
        const rows = await I.history(p.id);
        const label = { opening: 'Opening stock', purchase: 'Purchase', sale: 'Sale', adjustment: 'Adjustment' };
        UI.modal({
          title: 'History: ' + p.name, wide: true,
          body: rows.length ? '<div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th class="num">Change</th><th class="num">Stock after</th><th>Note</th></tr></thead><tbody>' + rows.map((r) =>
            '<tr><td>' + e(U.formatDateTime(r.createdAt)) + '</td><td>' + e(label[r.type] || r.type) + '</td><td class="num ' + (r.qtyChange < 0 ? 'neg' : 'pos') + '">' + (r.qtyChange > 0 ? '+' : '') + U.qty(r.qtyChange) + '</td><td class="num">' + U.qty(r.qtyAfter) + '</td><td>' + e([r.supplier, r.note, r.type === 'purchase' ? '@ ' + m(r.unitCost) : ''].filter(Boolean).join(' · ')) + '</td></tr>').join('') + '</tbody></table></div>'
            : '<p class="empty">No stock movements yet.</p>',
        });
      }
    }));
  };
})();

</script>
  <script>
/* views_sales.js — Sales, invoices, Customers. */
(function () {
  'use strict';
  const U = MZ.U, UI = MZ.UI, { $, $$, opt } = MZ.UI;
  const V = (MZ.Views = MZ.Views || {});
  const e = U.esc, m = U.money;

  /* ---------- Invoice ---------- */
  function invoiceHtml(s) {
    return '<div class="invoice"><h2>MIZAN SOLAR AND ELECTRONICS</h2><div class="sub">Solar &amp; Electronics · Bangladesh</div>' +
      '<div class="meta"><div><b>Invoice:</b> ' + e(s.invoiceNo) + '<br><b>Date:</b> ' + e(U.formatDate(s.date)) + ', ' + e(U.formatTime(s.createdAt)) + '</div>' +
      '<div><b>Customer:</b> ' + e(s.customerName) + (s.customerPhone ? '<br>' + e(s.customerPhone) : '') + '</div></div>' +
      '<table><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead><tbody>' +
      s.items.map((it, i) => '<tr><td>' + (i + 1) + '</td><td>' + e(it.name) + '</td><td class="num">' + U.qty(it.qty) + ' ' + e(it.unit || '') + '</td><td class="num">' + m(it.unitPrice) + '</td><td class="num">' + m(it.lineTotal) + '</td></tr>').join('') +
      '</tbody><tfoot>' +
      (s.discount > 0 ? '<tr><td colspan="4" class="right">Subtotal</td><td class="num">' + m(s.subtotal) + '</td></tr><tr><td colspan="4" class="right">Discount</td><td class="num">-' + m(s.discount) + '</td></tr>' : '') +
      '<tr><td colspan="4" class="right">Total</td><td class="num">' + m(s.total) + '</td></tr>' +
      '<tr><td colspan="4" class="right">Paid</td><td class="num">' + m(s.paid) + '</td></tr>' +
      '<tr><td colspan="4" class="right">Balance due</td><td class="num">' + m(s.due) + '</td></tr></tfoot></table>' +
      (s.note ? '<p><b>Note:</b> ' + e(s.note) + '</p>' : '') + '<p class="sub" style="margin-top:16px">Thank you for your purchase.</p></div>';
  }
  V.showInvoice = async function (sale) {
    if (typeof sale === 'number') sale = await MZ.Sales.getSale(sale);
    if (!sale) return UI.toast('Invoice not found.', true);
    UI.modal({
      title: 'Invoice ' + sale.invoiceNo, wide: true, body: invoiceHtml(sale),
      extraButtons: '<button type="button" id="prn" class="blue">Print invoice</button>',
      onOpen: (d) => d.querySelector('#prn').addEventListener('click', function () {
        document.getElementById('print-area').innerHTML = invoiceHtml(sale);
        window.print();
      }),
    });
  };

  /* ---------- Sale form ---------- */
  async function openSaleForm(onDone) {
    const [allP, customers] = await Promise.all([MZ.Inventory.listProducts(), MZ.DB.getAll('customers')]);
    const products = allP.filter((p) => !p.archived && p.qty > 0).sort((a, b) => a.name.localeCompare(b.name));
    if (!products.length) return UI.toast('There are no products in stock to sell. Add stock first.', true);
    customers.sort((a, b) => a.name.localeCompare(b.name));
    const pById = (id) => products.find((p) => p.id === Number(id));
    let newCustId = null, paidTouched = false;

    const lineHtml = () => '<div class="line" data-line><div class="row"><div class="full"><label>Product</label><select class="lp"><option value="">Choose product…</option>' +
      products.map((p) => '<option value="' + p.id + '">' + e(p.name) + ' — ' + U.qty(p.qty) + ' ' + e(p.unit) + ' in stock</option>').join('') + '</select></div>' +
      '<div><label>Quantity</label><input class="lq" inputmode="decimal" value="1"></div><div><label>Price each (৳)</label><input class="lpr" inputmode="decimal"></div>' +
      '<div class="full"><span class="muted small lhint"></span> <b>Line total: <span class="ltotal">৳0.00</span></b> <button type="button" class="small danger lrm" style="float:right">Remove</button></div></div></div>';

    UI.modal({
      title: 'New sale', wide: true, submitLabel: 'Save sale',
      body: '<div class="row"><div><label>Date</label><input type="date" name="date" value="' + U.today() + '" required></div>' +
        '<div><label>Customer (optional)</label><select name="customerId" id="sCust"><option value="">Walk-in customer</option>' + customers.map((c) => opt(c.id, c.name + (c.phone ? ' · ' + c.phone : ''))).join('') + '<option value="__new">＋ New customer…</option></select></div></div>' +
        '<div class="row hidden" id="newCust"><div><label>New customer name</label><input name="newName"></div><div><label>Phone (optional)</label><input name="newPhone" inputmode="tel"></div></div>' +
        '<div style="margin-top:12px"><b>Items</b></div><div id="lines"></div><button type="button" class="secondary" id="addLine">+ Add another item</button>' +
        '<div class="row"><div><label>Discount (৳)</label><input name="discount" id="sDisc" inputmode="decimal" value="0"></div><div><label>Amount paid now (৳)</label><input name="paid" id="sPaid" inputmode="decimal"></div></div>' +
        '<label>Note (optional)</label><input name="note">' +
        '<div class="totals"><div><span>Subtotal</span><b id="tSub">৳0.00</b></div><div><span>Discount</span><b id="tDisc">৳0.00</b></div><div class="big"><span>Total</span><span id="tTot">৳0.00</span></div>' +
        '<div><span>Gross profit on this sale</span><b id="tProf">৳0.00</b></div><div><span>Balance due</span><b id="tDue">৳0.00</b></div></div>',
      onOpen: function (d) {
        const linesEl = d.querySelector('#lines');
        function calc() {
          let sub = 0, cost = 0;
          $$('[data-line]', d).forEach(function (ln) {
            const p = pById($('.lp', ln).value), q = U.parseNum($('.lq', ln).value), pr = U.parseNum($('.lpr', ln).value);
            const ok = p && q > 0 && pr >= 0;
            const lt = ok ? q * pr : 0;
            $('.ltotal', ln).textContent = m(lt);
            $('.lhint', ln).textContent = p ? 'Cost ' + m(p.costPrice) + ' · ' : '';
            if (ok) { sub += lt; cost += q * p.costPrice; }
          });
          const disc = U.parseNum($('#sDisc', d).value) || 0;
          const total = U.round2(sub - disc);
          if (!paidTouched) $('#sPaid', d).value = total > 0 ? total.toFixed(2) : '';
          const paid = U.parseNum($('#sPaid', d).value) || 0;
          $('#tSub', d).textContent = m(sub); $('#tDisc', d).textContent = m(disc); $('#tTot', d).textContent = m(total);
          $('#tProf', d).textContent = m(total - cost); $('#tDue', d).textContent = m(total - paid);
        }
        function addLine() {
          linesEl.insertAdjacentHTML('beforeend', lineHtml());
          const ln = linesEl.lastElementChild;
          $('.lp', ln).addEventListener('change', function () { const p = pById(this.value); $('.lpr', ln).value = p ? p.sellPrice : ''; calc(); });
          $$('input', ln).forEach((i) => i.addEventListener('input', calc));
          $('.lrm', ln).addEventListener('click', function () { if ($$('[data-line]', d).length > 1) { ln.remove(); calc(); } });
        }
        addLine();
        $('#addLine', d).addEventListener('click', addLine);
        $('#sDisc', d).addEventListener('input', calc);
        $('#sPaid', d).addEventListener('input', function () { paidTouched = true; calc(); });
        $('#sCust', d).addEventListener('change', function () { $('#newCust', d).classList.toggle('hidden', this.value !== '__new'); });
      },
      onSubmit: async function (form) {
        const f = UI.formData(form);
        const items = $$('[data-line]', form).map((ln) => ({ productId: $('.lp', ln).value, qty: $('.lq', ln).value, unitPrice: $('.lpr', ln).value }));
        let customerId = f.customerId;
        if (customerId === '__new') {
          if (!newCustId) newCustId = await MZ.Customers.saveCustomer({ name: f.newName, phone: f.newPhone });
          customerId = newCustId;
        }
        const sale = await MZ.Sales.recordSale({ date: f.date, customerId: customerId || null, discount: f.discount, paid: f.paid, note: f.note, items: items });
        UI.closeDialog(); UI.toast('Sale saved: ' + sale.invoiceNo);
        if (onDone) onDone();
        V.showInvoice(sale);
        return false;
      },
    });
  }

  /* ---------- Sales list ---------- */
  const sf = { q: '', dueOnly: false };
  V.sales = async function (el) {
    const all = await MZ.Sales.listSales();
    const list = all.filter((s) => (!sf.dueOnly || s.due > 0) && (!sf.q || (s.invoiceNo + ' ' + s.customerName + ' ' + s.date).toLowerCase().indexOf(sf.q.toLowerCase()) >= 0)).slice(0, 300);
    el.innerHTML = '<div class="page-head"><h2>Sales</h2><button id="newSale">+ New sale</button></div>' +
      '<div class="toolbar"><input type="search" id="sq" placeholder="Search invoice or customer…" value="' + e(sf.q) + '" aria-label="Search sales"><select id="sdue" aria-label="Filter"><option value="">All sales</option><option value="due"' + (sf.dueOnly ? ' selected' : '') + '>With balance due</option></select></div>' +
      (list.length ? '<table class="rt"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Due</th><th class="num">Gross profit</th><th></th></tr></thead><tbody>' +
        list.map((s) => '<tr><td class="title" data-l="Invoice">' + e(s.invoiceNo) + '</td><td data-l="Date">' + e(U.formatDate(s.date)) + ' <span class="muted small">' + e(U.formatTime(s.createdAt)) + '</span></td><td data-l="Customer">' + e(s.customerName) + '</td><td class="num" data-l="Total">' + m(s.total) + '</td><td class="num" data-l="Paid">' + m(s.paid) + '</td><td class="num" data-l="Due">' + (s.due > 0 ? '<span class="badge low">' + m(s.due) + '</span>' : m(0)) + '</td><td class="num" data-l="Gross profit">' + m(s.profit) + '</td><td class="act"><button class="small secondary" data-inv="' + s.id + '">Invoice</button></td></tr>').join('') + '</tbody></table>' +
        (all.length > 300 ? '<p class="muted small">Showing the latest 300 sales. Use search to find older ones.</p>' : '')
        : '<p class="empty">' + (all.length ? 'No sales match.' : 'No sales yet. Tap “+ New sale” to record your first sale.') + '</p>');
    $('#newSale', el).addEventListener('click', () => openSaleForm(() => V.sales(el)));
    $('#sq', el).addEventListener('input', (ev) => { sf.q = ev.target.value; const pos = ev.target.selectionStart; V.sales(el).then(() => { const q = $('#sq'); q.focus(); q.setSelectionRange(pos, pos); }); });
    $('#sdue', el).addEventListener('change', (ev) => { sf.dueOnly = ev.target.value === 'due'; V.sales(el); });
    $$('[data-inv]', el).forEach((b) => b.addEventListener('click', () => V.showInvoice(Number(b.dataset.inv))));
  };

  /* ---------- Customers ---------- */
  const cf = { q: '', dueOnly: false };
  const custForm = (c) => { c = c || {}; return '<label>Name</label><input name="name" value="' + e(c.name || '') + '" required maxlength="100"><label>Phone</label><input name="phone" inputmode="tel" value="' + e(c.phone || '') + '"><label>Address (optional)</label><input name="address" value="' + e(c.address || '') + '">'; };

  async function openCustomer(id, el) {
    const d = await MZ.Customers.detail(id), c = d.customer;
    UI.modal({
      title: c.name, wide: true,
      body: '<p>' + (c.phone ? '📞 ' + e(c.phone) : '<span class="muted">No phone</span>') + (c.address ? ' · ' + e(c.address) : '') + '</p>' +
        '<div class="grid tiles"><div class="tile"><div class="lbl">Total purchases</div><div class="val">' + m(d.totalSales) + '</div></div><div class="tile"><div class="lbl">Total paid</div><div class="val">' + m(d.totalPaid) + '</div></div><div class="tile ' + (d.balance > 0 ? 'warn' : '') + '"><div class="lbl">Balance due</div><div class="val">' + m(d.balance) + '</div></div></div>' +
        '<h3>Purchase history</h3>' + (d.sales.length ? '<div class="scroll"><table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Due</th></tr></thead><tbody>' + d.sales.map((s) => '<tr><td><a href="#" data-inv="' + s.id + '">' + e(s.invoiceNo) + '</a></td><td>' + e(U.formatDate(s.date)) + '</td><td class="num">' + m(s.total) + '</td><td class="num">' + m(s.paid) + '</td><td class="num">' + m(s.due) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">No purchases yet.</p>') +
        '<h3 style="margin-top:14px">Payment history</h3>' + (d.payments.length ? '<div class="scroll"><table><thead><tr><th>Date</th><th class="num">Amount</th><th>Note</th></tr></thead><tbody>' + d.payments.map((p) => '<tr><td>' + e(U.formatDate(p.date)) + '</td><td class="num">' + m(p.amount) + '</td><td>' + e(p.note || '') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">No payments yet.</p>'),
      extraButtons: '<button type="button" class="secondary" id="cEdit">Edit</button>' + (d.balance > 0 ? '<button type="button" class="blue" id="cPay">Receive payment</button>' : ''),
      onOpen: function (dl) {
        $$('[data-inv]', dl).forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); V.showInvoice(Number(a.dataset.inv)); }));
        $('#cEdit', dl).addEventListener('click', () => UI.modal({ title: 'Edit customer', body: custForm(c), onSubmit: async (f) => { await MZ.Customers.saveCustomer(UI.formData(f), c.id); UI.toast('Customer updated.'); V.customers(el); } }));
        const pay = $('#cPay', dl);
        if (pay) pay.addEventListener('click', () => UI.modal({
          title: 'Receive payment — ' + c.name, submitLabel: 'Save payment',
          body: '<p>Balance due: <b>' + m(d.balance) + '</b></p><label>Amount received (৳)</label><input name="amount" inputmode="decimal" required><label>Date</label><input type="date" name="date" value="' + U.today() + '" required><label>Note (optional)</label><input name="note">',
          onSubmit: async (f) => { const v = UI.formData(f); await MZ.Customers.receivePayment(c.id, v.amount, v.date, v.note); UI.toast('Payment saved.'); V.customers(el); },
        }));
      },
    });
  }

  V.customers = async function (el) {
    const all = await MZ.Customers.listWithBalances();
    const list = all.filter((c) => (!cf.dueOnly || c.balance > 0) && (!cf.q || (c.name + ' ' + c.phone).toLowerCase().indexOf(cf.q.toLowerCase()) >= 0)).sort((a, b) => b.balance - a.balance || a.name.localeCompare(b.name));
    const owed = U.round2(all.reduce((t, c) => t + Math.max(c.balance, 0), 0));
    el.innerHTML = '<div class="page-head"><h2>Customers</h2><button id="addC">+ New customer</button></div>' +
      '<div class="toolbar"><input type="search" id="cq" placeholder="Search name or phone…" value="' + e(cf.q) + '" aria-label="Search customers"><select id="cdue" aria-label="Filter"><option value="">All customers</option><option value="due"' + (cf.dueOnly ? ' selected' : '') + '>Owing money</option></select></div>' +
      '<p class="muted small">' + all.length + ' customer(s) · total owed to you: <b>' + m(owed) + '</b></p>' +
      (list.length ? '<table class="rt"><thead><tr><th>Name</th><th>Phone</th><th class="num">Purchases</th><th class="num">Balance due</th><th></th></tr></thead><tbody>' +
        list.map((c) => '<tr><td class="title" data-l="Name">' + e(c.name) + '</td><td data-l="Phone">' + e(c.phone || '—') + '</td><td class="num" data-l="Purchases">' + m(c.totalSales) + '</td><td class="num" data-l="Balance due">' + (c.balance > 0 ? '<span class="badge low">' + m(c.balance) + '</span>' : m(0)) + '</td><td class="act"><button class="small secondary" data-open="' + c.id + '">Open</button></td></tr>').join('') + '</tbody></table>'
        : '<p class="empty">' + (all.length ? 'No customers match.' : 'No customers yet. Customers can also be added while recording a sale.') + '</p>');
    $('#addC', el).addEventListener('click', () => UI.modal({ title: 'New customer', body: custForm(), onSubmit: async (f) => { await MZ.Customers.saveCustomer(UI.formData(f)); UI.toast('Customer saved.'); V.customers(el); } }));
    $('#cq', el).addEventListener('input', (ev) => { cf.q = ev.target.value; const pos = ev.target.selectionStart; V.customers(el).then(() => { const q = $('#cq'); q.focus(); q.setSelectionRange(pos, pos); }); });
    $('#cdue', el).addEventListener('change', (ev) => { cf.dueOnly = ev.target.value === 'due'; V.customers(el); });
    $$('[data-open]', el).forEach((b) => b.addEventListener('click', () => openCustomer(Number(b.dataset.open), el)));
  };
})();

</script>
  <script>
/* views_misc.js — Expenses and Backup screens. */
(function () {
  'use strict';
  const U = MZ.U, UI = MZ.UI, A = MZ.Analytics, { $, $$, opt } = MZ.UI;
  const V = (MZ.Views = MZ.Views || {});
  const e = U.esc, m = U.money;
  let expMonth = U.monthKey(U.today());

  const expForm = (x) => { x = x || {}; return '<div class="row"><div><label>Date</label><input type="date" name="date" value="' + e(x.date || U.today()) + '" required></div>' +
    '<div><label>Category</label><select name="category">' + MZ.Expenses.CATEGORIES.map((c) => opt(c, c, c === x.category)).join('') + '</select></div></div>' +
    '<div class="row"><div><label>Amount (৳)</label><input name="amount" inputmode="decimal" value="' + (x.amount != null ? x.amount : '') + '" required></div><div><label>Note (optional)</label><input name="note" value="' + e(x.note || '') + '"></div></div>'; };

  V.expenses = async function (el) {
    const [all, sales] = await Promise.all([MZ.Expenses.listExpenses(), MZ.Sales.listSales()]);
    const valid = /^\d{4}-\d{2}$/.test(expMonth) ? expMonth : U.monthKey(U.today());
    const list = all.filter((x) => U.monthKey(x.date) === valid);
    const total = U.round2(list.reduce((t, x) => t + x.amount, 0));
    const t = A.totals({ sales: sales, expenses: all }, valid + '-01', valid + '-31');
    const byCat = {}; list.forEach((x) => { byCat[x.category] = (byCat[x.category] || 0) + x.amount; });

    el.innerHTML = '<div class="page-head"><h2>Expenses</h2><button id="addE">+ New expense</button></div>' +
      '<div class="card"><label for="eMonth" style="margin-top:0">Month</label><input type="month" id="eMonth" value="' + e(valid) + '"></div>' +
      '<div class="card"><h3>Profit for ' + e(U.monthLabel(valid)) + '</h3>' +
      '<div class="totals" style="margin-top:0"><div><span>Sales</span><b>' + m(t.sales) + '</b></div><div><span>Gross profit <small class="muted">(sales profit, before expenses)</small></span><b>' + m(t.gross) + '</b></div>' +
      '<div><span>− Expenses</span><b>' + m(total) + '</b></div><div class="big"><span>Net profit <small class="muted">(what you really kept)</small></span><span class="' + (t.net < 0 ? 'neg' : '') + '">' + m(t.net) + '</span></div></div></div>' +
      (Object.keys(byCat).length ? '<div class="card"><h3>By category</h3><table><tbody>' + Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]).map((k) => '<tr><td>' + e(k) + '</td><td class="num">' + m(byCat[k]) + '</td></tr>').join('') + '</tbody></table></div>' : '') +
      '<div class="card"><h3>Expense list</h3>' + (list.length ? '<table class="rt"><thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Amount</th><th></th></tr></thead><tbody>' +
        list.map((x) => '<tr><td class="title" data-l="Date">' + e(U.formatDate(x.date)) + '</td><td data-l="Category">' + e(x.category) + '</td><td data-l="Note">' + e(x.note || '—') + '</td><td class="num" data-l="Amount">' + m(x.amount) + '</td><td class="act"><div class="actions"><button class="small secondary" data-ed="' + x.id + '">Edit</button><button class="small danger" data-del="' + x.id + '">Delete</button></div></td></tr>').join('') +
        '</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">' + m(total) + '</td><td></td></tr></tfoot></table>' : '<p class="empty">No expenses in this month.</p>') + '</div>';

    $('#eMonth', el).addEventListener('change', (ev) => { expMonth = ev.target.value; V.expenses(el); });
    $('#addE', el).addEventListener('click', () => UI.modal({ title: 'New expense', body: expForm(), submitLabel: 'Save expense', onSubmit: async (f) => { await MZ.Expenses.saveExpense(UI.formData(f)); UI.toast('Expense saved.'); V.expenses(el); } }));
    $$('[data-ed]', el).forEach((b) => b.addEventListener('click', () => { const x = all.find((y) => y.id === Number(b.dataset.ed)); UI.modal({ title: 'Edit expense', body: expForm(x), onSubmit: async (f) => { await MZ.Expenses.saveExpense(UI.formData(f), x.id); UI.toast('Expense updated.'); V.expenses(el); } }); }));
    $$('[data-del]', el).forEach((b) => b.addEventListener('click', async () => {
      const x = all.find((y) => y.id === Number(b.dataset.del));
      if (await UI.confirmBox('Delete this expense?', e(x.category) + ' · ' + m(x.amount) + ' on ' + e(U.formatDate(x.date)) + '. This cannot be undone.', 'Delete', true)) { await MZ.Expenses.deleteExpense(x.id); UI.toast('Expense deleted.'); V.expenses(el); }
    }));
  };

  /* ---------- Backup ---------- */
  const labels = { products: 'Products', stockMovements: 'Stock movements', customers: 'Customers', sales: 'Sales', payments: 'Payments', expenses: 'Expenses' };

  V.backup = async function (el) {
    const last = await MZ.DB.getMeta('lastExport', null);
    const data = await MZ.DB.loadAll();
    el.innerHTML = '<div class="page-head"><h2>Backup &amp; Transfer</h2></div>' +
      '<div class="banner info">Your records are stored only inside this browser on this device. If you clear browser data or lose the device, they are gone — so save a backup regularly (for example every week).</div>' +
      '<div class="card"><h3>1. Save a backup</h3><p>Downloads one file with <b>all</b> your records (products, stock history, customers, sales, payments, expenses).</p>' +
      '<p class="muted small">Last backup: ' + (last ? e(U.formatDateTime(last.at)) : '<b>never</b>') + '</p><button id="bkExport">Download backup file</button><div id="bkMsg"></div></div>' +
      '<div class="card"><h3>2. Restore or move to another device</h3><p>Choose a backup file. <b>This replaces everything currently in this app</b> with the records from the file. You will see a summary and be asked to confirm first.</p>' +
      '<input type="file" id="bkFile" accept=".json,application/json"></div>' +
      '<div class="card"><h3>Move data between PC and phone</h3><ol><li>On the first device: <b>Download backup file</b>.</li><li>Send the file to the other device (WhatsApp “to myself”, email, USB, or Google Drive).</li><li>On the other device: open this app → Backup → choose the file.</li></ol><p class="muted small">Always use the newest file and only keep working on one device at a time, otherwise newer records on the other device would be replaced.</p></div>' +
      '<div class="card"><h3>Stored on this device now</h3><table><tbody>' + MZ.Backup.DATA_STORES.map((n) => '<tr><td>' + labels[n] + '</td><td class="num">' + data[n].length + '</td></tr>').join('') + '</tbody></table></div>';

    $('#bkExport', el).addEventListener('click', async function () {
      try {
        const r = await MZ.Backup.exportToFile();
        $('#bkMsg', el).innerHTML = '<div class="banner info" style="margin-top:12px">Backup saved as <b>' + e(r.name) + '</b> (' + r.counts.sales + ' sales, ' + r.counts.products + ' products, ' + r.counts.customers + ' customers, ' + r.counts.expenses + ' expenses). Check your Downloads folder.</div>';
      } catch (err) { $('#bkMsg', el).innerHTML = '<div class="err">' + e(UI.errText(err)) + '</div>'; }
    });

    $('#bkFile', el).addEventListener('change', async function (ev) {
      const f = ev.target.files[0]; ev.target.value = '';
      if (!f) return;
      let info;
      try { info = await MZ.Backup.readFile(f); } catch (err) { return UI.modal({ title: 'Cannot use this file', body: '<div class="err" style="margin-top:12px">' + e(UI.errText(err)) + '</div><p>Nothing in the app was changed.</p>' }); }
      const b = info.file;
      const rows = MZ.Backup.DATA_STORES.map((n) => '<tr><td>' + labels[n] + '</td><td class="num">' + info.currentCounts[n] + '</td><td class="num"><b>' + b.counts[n] + '</b></td></tr>').join('');
      UI.modal({
        title: 'Replace all records?', submitLabel: 'Yes, replace my records', wide: true,
        body: (info.duplicate ? '<div class="banner" style="margin-top:12px"><b>This exact backup was already imported on ' + e(U.formatDateTime(info.duplicate.at)) + '.</b> Importing it again will overwrite anything you added since then.</div>' : '') +
          '<p style="margin-top:12px">Backup made on <b>' + e(U.formatDateTime(b.exportedAt)) + '</b>.</p>' +
          '<table><thead><tr><th>Records</th><th class="num">Now in app</th><th class="num">In backup file</th></tr></thead><tbody>' + rows + '</tbody></table>' +
          '<div class="banner" style="margin-top:12px">Everything currently in the app will be replaced. Records that are only in the app and not in the file will be lost. Tip: cancel and download a backup of the current data first if unsure.</div>',
        onSubmit: async function () { await MZ.Backup.importFile(b); UI.toast('Backup restored successfully.'); MZ.refresh(); },
      });
    });
  };
})();

</script>
  <script>
/* app.js — router, startup, service worker. */
(function () {
  'use strict';
  const { $, $$, toast } = MZ.UI;
  const routes = {
    dashboard: MZ.Views.dashboard, sales: MZ.Views.sales, inventory: MZ.Views.inventory,
    customers: MZ.Views.customers, expenses: MZ.Views.expenses, reports: MZ.Views.reports, backup: MZ.Views.backup,
  };

  async function route() {
    const name = (location.hash.replace(/^#\//, '').split('?')[0]) || 'dashboard';
    const fn = routes[name] || routes.dashboard;
    $$('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.r === (routes[name] ? name : 'dashboard')));
    const view = $('#view');
    try {
      await fn(view);
    } catch (e) {
      console.error(e);
      view.innerHTML = '<div class="err">Could not load this screen: ' + MZ.U.esc(e.message || e) + '</div>';
    }
    window.scrollTo(0, 0);
  }
  MZ.refresh = route;

  function tick() {
    const n = new Date();
    $('#clockTime').textContent = MZ.U.formatTime(n);
    $('#clockDate').textContent = n.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
  }

  async function start() {
    try {
      await MZ.DB.open();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (e) {
      $('#view').innerHTML = '<div class="err">' + MZ.U.esc(e.message || e) + '</div>';
      return;
    }
    window.addEventListener('hashchange', route);
    tick(); setInterval(tick, 15000);
    await route();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker failed', e));
    }
  }
  window.addEventListener('unhandledrejection', (e) => { console.error(e.reason); toast('Unexpected error: ' + ((e.reason && e.reason.message) || e.reason), true); });
  start();
})();

</script>
